[platformio]
default_envs = esp32c3

[env]
build_flags = -Wall -Wextra

[env:esp32c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Host-side unit tests of lib/thermal_core, no board or simulator needed.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = ${env.build_flags} -std=gnu++11 -I test/fakes
